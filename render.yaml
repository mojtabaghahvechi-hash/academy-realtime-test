services:
  - type: web
    name: persian-academy-realtime-test
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ONEXAI_API_KEY
        sync: false
      - key: TEST_USERNAME
        sync: false
      - key: TEST_PASSWORD
        sync: false
